name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller app.spec --noconfirm --clean

      - name: Zip build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist\FournisseursMatcher\* `
            -DestinationPath dist\FournisseursMatcher-win64.zip `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FournisseursMatcher-win64
          path: dist/FournisseursMatcher-win64.zip